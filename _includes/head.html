<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title><meta property="og:site_name" content="{{ site.title | escape }}"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}">{% if page.image %}<meta property="og:image" content="{{ '/assets/img/' | append: page.image | absolute_url }}">{% endif %}<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}"><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"><link rel="canonical" href="{{ page.url | absolute_url }}"></head>
